name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Backend verify
        run: ./mvnw -B verify
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: frontend
      - name: Lint
        run: npm run lint
        working-directory: frontend
      - name: Type check
        run: npm run typecheck
        working-directory: frontend
      - name: Unit tests
        run: npm test -- --run
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Build control-plane image
        run: docker build -f infra/docker/backend.Dockerfile --build-arg MODULE=taskforge-control-plane backend
      - name: Build scheduler image
        run: docker build -f infra/docker/backend.Dockerfile --build-arg MODULE=taskforge-scheduler backend
      - name: Build worker image
        run: docker build -f infra/docker/backend.Dockerfile --build-arg MODULE=taskforge-worker backend
      - name: Build frontend image
        run: docker build -f infra/docker/frontend.Dockerfile frontend
