global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: taskforge-control-plane
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["control-plane:8080"]

  - job_name: taskforge-scheduler
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["scheduler:8081"]

  - job_name: taskforge-worker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["worker:8082"]
