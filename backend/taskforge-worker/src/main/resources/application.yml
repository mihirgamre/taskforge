spring:
  application:
    name: taskforge-worker
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    consumer:
      group-id: taskforge-worker
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
server:
  shutdown: graceful
taskforge:
  worker:
    dispatch-topic: taskforge.task-dispatch.v1
