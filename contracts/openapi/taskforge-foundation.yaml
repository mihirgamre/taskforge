openapi: 3.1.0
info:
  title: TaskForge Foundation API
  version: 0.1.0
paths:
  /api/foundation:
    get:
      summary: Returns service foundation metadata.
      responses:
        '200':
          description: Service metadata.
          content:
            application/json:
              schema:
                type: object
                required: [service, version]
                properties:
                  service:
                    type: string
                  version:
                    type: string

